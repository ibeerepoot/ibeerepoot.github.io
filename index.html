<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iris Beerepoot</title>
  <meta name="description" content="Iris Beerepoot — Assistant Professor of Process Science at Utrecht University. Publications on process mining, workarounds and information systems.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="backdrop"></div>

  <div class="shell">
    <header>
      <div class="ident">
        <h1>Iris Beerepoot</h1>
        <span class="tagline">Process Science &mdash; the work, mapped</span>
      </div>
      <a class="affil" href="https://www.uu.nl/staff/IMBeerepoot">
        <img src="assets/uu-logo.png" alt="Utrecht University" width="480" height="189">
      </a>
    </header>

    <div class="controls">
      <div id="mode" class="mode-toggle" role="group" aria-label="Filter by"></div>
      <div id="pills" class="pill-strip"></div>
      <input type="search" id="search" placeholder="Search titles, authors, venues&hellip;"
             autocomplete="off" aria-label="Search publications">
      <button id="reset" type="button">reset</button>
    </div>

    <div class="map-area">
      <div id="graph-scroll">
        <canvas id="viz-map" aria-hidden="true"></canvas>
      </div>
      <p class="hint">Scroll sideways through the years &middot; lines link papers that share a topic &middot; pick a collaborator to trace their path</p>
      <aside id="rail" hidden></aside>
    </div>
  </div>

  <!-- Op mobiel is dit de site. Op desktop staat het buiten beeld, maar wel in de
       DOM: het canvas hierboven is onleesbaar voor screenreaders en crawlers. -->
  <main id="list-view">
    <h2>Publications</h2>
    <p id="count"></p>
    <div id="pub-list">Loading&hellip;</div>
    <noscript>
      <p>This site renders its publication list with JavaScript. The full, always
         up-to-date list is also available on
         <a href="https://research-portal.uu.nl/en/persons/iris-beerepoot/publications/">Utrecht University's research portal</a>.</p>
    </noscript>
  </main>
</body>
</html>
